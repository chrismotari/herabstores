; Supervisor program for the API's queue worker (spec 7.1).
; Runs storefront revalidation webhooks and emails (verification, password reset).
; Install: copy to /etc/supervisor/conf.d/, set the paths and user, then
;   supervisorctl reread && supervisorctl update && supervisorctl start herabs-worker:*
; After each deploy: php artisan queue:restart (workers finish their job, then reload the new code).

[program:herabs-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/herabstores/api/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/herabstores/api
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/herabstores/api/storage/logs/worker.log
